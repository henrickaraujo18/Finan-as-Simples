name: Publicar Finança Simples para Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      FINANCA_SIMPLES_UPDATE_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Validar canal de atualização
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_PUBKEY)) {
            throw "Secret TAURI_UPDATER_PUBLIC_KEY não configurado."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Secret TAURI_SIGNING_PRIVATE_KEY não configurado."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD não configurado."
          }

          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if (-not $env:GITHUB_REF_NAME.StartsWith("desktop-v")) {
              throw "Tag inválida: $env:GITHUB_REF_NAME"
            }

            $tagVersion = $env:GITHUB_REF_NAME.Substring("desktop-v".Length)
            $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json

            if ($config.version -ne $tagVersion) {
              throw "A tag desktop-v$tagVersion não corresponde à versão $($config.version) em src-tauri/tauri.conf.json."
            }
          }

      - name: Instalar dependências
        run: npm ci

      - name: Compilar, assinar e publicar
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: desktop-v__VERSION__
          releaseName: "Finança Simples v__VERSION__"
          releaseBody: "Atualização automática do Finança Simples para Windows."
          releaseDraft: false
          prerelease: false
          retryAttempts: 2
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
