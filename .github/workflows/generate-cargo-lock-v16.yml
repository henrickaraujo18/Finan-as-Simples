name: Gerar Cargo.lock 1.6

on:
  push:
    branches:
      - feature/auth-workspaces-auto-update-1.6
    paths:
      - ".github/workflows/generate-cargo-lock-v16.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auth-workspaces-auto-update-1.6
      - uses: dtolnay/rust-toolchain@stable
      - name: Gerar lockfile reprodutível
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Versionar Cargo.lock
        run: |
          git config user.name "Finança Simples CI"
          git config user.email "actions@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: version Cargo.lock for reproducible Windows builds"
          git push origin HEAD:feature/auth-workspaces-auto-update-1.6
