name: Finalizar integração 1.6

on:
  push:
    branches:
      - feature/auth-workspaces-auto-update-1.6
    paths:
      - ".github/workflows/finalize-v16-source.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auth-workspaces-auto-update-1.6
          fetch-depth: 0

      - name: Integrar recuperação, cloud e validações finais
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"trecho não encontrado: {label}")
              return text.replace(old, new, 1)

          # ---- Rust: registrar backup portátil/restore no app real ----
          path = Path("src-tauri/src/lib_operational.rs")
          text = path.read_text(encoding="utf-8")
          marker = '''struct UpdateResult {
              configured: bool,
              available: bool,
              version: Option<String>,
              message: String,
          }
          '''
          addition = marker + '''
          #[derive(Debug, Serialize)]
          #[serde(rename_all = "camelCase")]
          struct PortableBackupInfo {
              path: String,
              recovery_key: String,
          }
          '''
          if "struct PortableBackupInfo" not in text:
              text = replace_once(text, marker, addition, "PortableBackupInfo")

          backup_marker = '''#[tauri::command]
          fn create_backup(db:State<'_,LocalDb>,auth:State<'_,AuthState>)->Result<String,String>{
              let (user_id,workspace_id,permissions,is_super_admin)=require_context(&db,&auth)?;
              let role={let connection=db.connection.lock().map_err(|_|"banco local indisponível".to_string())?;workspace_role(&connection,&user_id,&workspace_id)?};
              if !is_super_admin && role!="owner" && !permission_allowed(&permissions,"exports","create"){
                  return Err("sem permissão para criar backup".to_string());
              }
              create_backup_internal(&db)
          }
          '''
          backup_addition = backup_marker + '''
          #[tauri::command]
          fn get_recovery_key(db:State<'_,LocalDb>,auth:State<'_,AuthState>)->Result<String,String>{
              let (user_id,workspace_id,_,is_super_admin)=require_context(&db,&auth)?;
              let role={let connection=db.connection.lock().map_err(|_|"banco local indisponível".to_string())?;workspace_role(&connection,&user_id,&workspace_id)?};
              if !is_super_admin && role!="owner" {
                  return Err("somente o proprietário do ambiente pode acessar a chave de recuperação".to_string());
              }
              #[cfg(target_os="windows")]
              { return security_v16::recovery_key_hex(&db.path); }
              #[cfg(not(target_os="windows"))]
              { Err("backup portátil está disponível no aplicativo Windows".to_string()) }
          }

          #[tauri::command]
          fn create_portable_backup(db:State<'_,LocalDb>,auth:State<'_,AuthState>)->Result<PortableBackupInfo,String>{
              let (user_id,workspace_id,_,is_super_admin)=require_context(&db,&auth)?;
              let connection=db.connection.lock().map_err(|_|"banco local indisponível".to_string())?;
              let role=workspace_role(&connection,&user_id,&workspace_id)?;
              if !is_super_admin && role!="owner" {
                  return Err("somente o proprietário do ambiente pode criar backup portátil".to_string());
              }
              #[cfg(target_os="windows")]
              {
                  let (path,recovery_key)=security_v16::create_portable_backup(&connection,&db.path)?;
                  audit(&connection,Some(&user_id),Some(&workspace_id),"portable_backup_create",json!({"path":path}));
                  return Ok(PortableBackupInfo{path,recovery_key});
              }
              #[cfg(not(target_os="windows"))]
              { Err("backup portátil está disponível no aplicativo Windows".to_string()) }
          }

          #[tauri::command]
          fn restore_portable_backup(
              app:tauri::AppHandle,
              db:State<'_,LocalDb>,
              auth:State<'_,AuthState>,
              backup_path:String,
              recovery_key:String,
          )->Result<(),String>{
              #[cfg(target_os="windows")]
              {
                  let backup=PathBuf::from(backup_path.trim());
                  let mut connection=db.connection.lock().map_err(|_|"banco local indisponível".to_string())?;
                  security_v16::restore_portable_backup(&mut connection,&db.path,&backup,&recovery_key)?;
                  configure_database(&connection)?;
                  drop(connection);
                  *auth.session.lock().map_err(|_|"sessão indisponível".to_string())?=AuthSession::default();
                  app.restart();
              }
              #[cfg(not(target_os="windows"))]
              { Err("restauração portátil está disponível no aplicativo Windows".to_string()) }
          }
          '''
          if "fn create_portable_backup(db:" not in text:
              text = replace_once(text, backup_marker, backup_addition, "comandos de recuperação")

          handler_old = '''upsert_entities,delete_entity,pending_sync_count,export_snapshot,create_backup,check_and_install_update,
                      cloud_runtime_v16::cloud_reconcile_login,cloud_runtime_v16::cloud_ensure_workspace,cloud_runtime_v16::cloud_sync'''
          handler_new = '''upsert_entities,delete_entity,pending_sync_count,export_snapshot,create_backup,get_recovery_key,
                      create_portable_backup,restore_portable_backup,check_and_install_update,
                      cloud_runtime_v16::cloud_reconcile_login,cloud_runtime_v16::cloud_ensure_workspace,cloud_runtime_v16::cloud_sync'''
          if "create_portable_backup,restore_portable_backup" not in text:
              text = replace_once(text, handler_old, handler_new, "registro de comandos Tauri")
          path.write_text(text, encoding="utf-8")

          # ---- Rust cloud: nunca desativar workspace local ao reconciliar conta cloud vazia ----
          path = Path("src-tauri/src/cloud_runtime_v16.rs")
          text = path.read_text(encoding="utf-8")
          old = '''    let workspaces = fetch_workspaces(&http, &access_token).await?;
              let is_platform_admin = fetch_platform_admin(&http, &access_token, &user.id)'''
          new = '''    let workspaces = fetch_workspaces(&http, &access_token).await?;
              if workspaces.is_empty() {
                  return Err("conta autenticada sem ambiente financeiro autorizado".to_string());
              }
              let is_platform_admin = fetch_platform_admin(&http, &access_token, &user.id)'''
          if "conta autenticada sem ambiente financeiro autorizado" not in text:
              text = replace_once(text, old, new, "proteção de reconciliação cloud")
          path.write_text(text, encoding="utf-8")

          # ---- Frontend cloud: migrar corretamente um primeiro uso totalmente offline ----
          path = Path("desktop-dist/cloud-runtime-v16.js")
          text = path.read_text(encoding="utf-8")
          ensure_marker = '''  async function ensureCloudWorkspace(status) {
              const workspaceId = status?.activeWorkspaceId;
              if (!workspaceId) return status;
              const workspace = (status.workspaces || []).find((item) => item.id === workspaceId);
              if (!workspace) return status;
              const accessToken = await token();
              await nativeInvoke("cloud_ensure_workspace", {
                accessToken,
                workspaceId,
                name: workspace.name || "Meu Financeiro",
              });
              return status;
            }
          '''
          ensure_addition = ensure_marker + '''
            async function ensureAllCloudWorkspaces(status) {
              const accessToken = await token();
              for (const workspace of status?.workspaces || []) {
                await nativeInvoke("cloud_ensure_workspace", {
                  accessToken,
                  workspaceId: workspace.id,
                  name: workspace.name || "Meu Financeiro",
                });
              }
              return status;
            }

            async function fetchCloudWorkspaces() {
              const accessToken = await token();
              const response = await fetch(`${cfg.supabaseUrl}/rest/v1/rpc/fs_my_workspaces`, {
                method: "POST",
                headers: { ...apiHeaders(), Authorization: `Bearer ${accessToken}` },
                body: "{}",
              });
              return parseResponse(response, "Não foi possível consultar seus ambientes financeiros.");
            }
          '''
          if "async function ensureAllCloudWorkspaces" not in text:
              text = replace_once(text, ensure_marker, ensure_addition, "helpers de workspace cloud")

          old_boot = '''  async function bootstrapExistingCloudAccount(password) {
              const reconciled = await reconcile(password);
              if ((reconciled?.workspaces || []).length) {
                await syncNow().catch(() => {});
                return reconciled;
              }
              return null;
            }
          '''
          new_boot = '''  async function bootstrapExistingCloudAccount(password) {
              const workspaces = await fetchCloudWorkspaces();
              if (!Array.isArray(workspaces) || workspaces.length === 0) return null;
              const reconciled = await reconcile(password);
              await syncNow().catch(() => {});
              return reconciled;
            }
          '''
          if old_boot in text:
              text = text.replace(old_boot, new_boot, 1)
          text = text.replace("await ensureCloudWorkspace(local);", "await ensureAllCloudWorkspaces(local);")

          pattern = re.compile(r'''  async function cloudLogin\(args\) \{.*?\n  \}\n\n  async function requestReset''', re.S)
          replacement = '''  async function cloudLogin(args) {
              if (!cloudOnline()) return nativeInvoke("auth_login", args);
              try {
                await signIn(args?.email, args?.password);

                // Se este Windows foi configurado primeiro sem internet, publique todos os
                // ambientes locais antes de reconciliar. Isso impede perda de membership local.
                try {
                  const localStatus = await nativeInvoke("auth_login", args);
                  if ((localStatus?.workspaces || []).length) await ensureAllCloudWorkspaces(localStatus);
                } catch (_) {
                  // Em um computador novo não existe verificador local; a nuvem é suficiente.
                }

                const reconciled = await reconcile(args?.password);
                await syncNow().catch(() => {});
                return reconciled;
              } catch (error) {
                if (networkFailure(error)) return nativeInvoke("auth_login", args);

                if (error instanceof CloudError && [400, 401].includes(error.status)) {
                  clearCloudSession();
                  let localStatus;
                  try {
                    localStatus = await nativeInvoke("auth_login", args);
                  } catch (_) {
                    throw new Error("E-mail ou senha inválidos.");
                  }

                  // Conta criada originalmente offline: cria a identidade cloud somente depois
                  // de validar a mesma senha local, evitando apropriação indevida de dados.
                  const created = await signUp(args?.email, args?.password);
                  if (created?.user?.identities && created.user.identities.length === 0) {
                    clearCloudSession();
                    throw new Error("Esta conta já existe na nuvem com outra senha. Use ‘Esqueci minha senha’ para reconciliar o acesso.");
                  }
                  if (!created?.access_token) {
                    clearCloudSession();
                    throw new Error("Conta online criada. Confirme o e-mail recebido e depois entre novamente; seus dados locais permanecerão preservados.");
                  }
                  await ensureAllCloudWorkspaces(localStatus);
                  const reconciled = await reconcile(args?.password);
                  await syncNow().catch(() => {});
                  return reconciled;
                }

                clearCloudSession();
                throw error;
              }
            }

            async function requestReset'''
          if "Conta criada originalmente offline" not in text:
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit("função cloudLogin não encontrada")
          path.write_text(text, encoding="utf-8")

          # ---- Carregar UI de recuperação ----
          path = Path("desktop-dist/index.html")
          text = path.read_text(encoding="utf-8")
          if 'src="recovery-v16.js"' not in text:
              text = replace_once(text, '    <script src="cloud-ui-v16.js"></script>\n', '    <script src="cloud-ui-v16.js"></script>\n    <script src="recovery-v16.js"></script>\n', "script de recuperação")
          path.write_text(text, encoding="utf-8")

          # ---- Teste real de backup/restore SQLCipher + DPAPI no Windows ----
          path = Path("src-tauri/src/security_v16.rs")
          text = path.read_text(encoding="utf-8")
          test_marker = '''    fn parser_aceita_apenas_chave_de_256_bits_em_hex() {
                  let valid = "11".repeat(32);
                  assert_eq!(parse_hex_32(&valid).unwrap().len(), 32);
                  assert!(parse_hex_32("1234").is_err());
                  assert!(parse_hex_32(&"zz".repeat(32)).is_err());
              }
          '''
          test_add = test_marker + '''
              #[test]
              fn backup_portatil_restaura_snapshot_validado() {
                  let dir=std::env::temp_dir().join(format!("financa-simples-security-{}",chrono::Utc::now().timestamp_nanos_opt().unwrap_or_default()));
                  fs::create_dir_all(&dir).unwrap();
                  let db_path=dir.join("financa-simples.sqlite3");
                  let local_key=generate_key().to_vec();
                  save_key(&db_path,&local_key).unwrap();
                  let mut connection=Connection::open(&db_path).unwrap();
                  apply_key(&connection,&local_key).unwrap();
                  connection.execute_batch("CREATE TABLE app_metadata(key TEXT PRIMARY KEY,value TEXT NOT NULL); INSERT INTO app_metadata(key,value) VALUES('product_scope','financa-simples'); CREATE TABLE probe(value TEXT NOT NULL); INSERT INTO probe(value) VALUES('antes');").unwrap();
                  let (backup,key)=create_portable_backup(&connection,&db_path).unwrap();
                  connection.execute("UPDATE probe SET value='depois'",[]).unwrap();
                  restore_portable_backup(&mut connection,&db_path,Path::new(&backup),&key).unwrap();
                  let value:String=connection.query_row("SELECT value FROM probe",[],|row|row.get(0)).unwrap();
                  assert_eq!(value,"antes");
                  drop(connection);
                  let _=fs::remove_dir_all(dir);
              }
          '''
          if "backup_portatil_restaura_snapshot_validado" not in text:
              text = replace_once(text, test_marker, test_add, "teste de backup portátil")
          path.write_text(text, encoding="utf-8")

          # ---- CI deve verificar os novos recursos ----
          path = Path(".github/workflows/build-windows.yml")
          text = path.read_text(encoding="utf-8")
          if '"desktop-dist/recovery-v16.js"' not in text:
              text = text.replace('            "desktop-dist/cloud-config.js",\n', '            "desktop-dist/cloud-config.js",\n            "desktop-dist/recovery-v16.js",\n', 1)
              text = text.replace('          node --check desktop-dist/cloud-config.js\n', '          node --check desktop-dist/cloud-config.js\n          node --check desktop-dist/recovery-v16.js\n', 1)
          if '"restore_portable_backup"' not in text:
              text = text.replace('            "FINANCA_UPDATER_PUBLIC_KEY"\n', '            "FINANCA_UPDATER_PUBLIC_KEY",\n            "create_portable_backup",\n            "restore_portable_backup",\n            "recovery_key_hex",\n            "cloud_sync"\n', 1)
          path.write_text(text, encoding="utf-8")

          # Código experimental de loopback não era registrado nem necessário no fluxo final.
          dead = Path("src-tauri/src/recovery_server_v16.rs")
          if dead.exists():
              dead.unlink()
          PY

          node --check desktop-dist/cloud-runtime-v16.js
          node --check desktop-dist/recovery-v16.js

      - name: Registrar integração final na branch
        shell: bash
        run: |
          git config user.name "Finança Simples CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Finança Simples 1.6: integrate recovery and offline-cloud migration"
          git push origin HEAD:feature/auth-workspaces-auto-update-1.6
