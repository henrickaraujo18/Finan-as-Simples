name: Validar e publicar Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop-dist/**"
      - ".github/workflows/deploy-web.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop-dist/**"
      - ".github/workflows/deploy-web.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar aplicação web compartilhada
        shell: bash
        run: |
          test -s desktop-dist/index.html
          test -s desktop-dist/app.js
          test -s desktop-dist/styles.css
          test -s desktop-dist/sw.js
          test -s desktop-dist/manifest.webmanifest
          grep -q "indexedDB" desktop-dist/app.js
          grep -q "serviceWorker" desktop-dist/app.js
          grep -q "Produtos & Precificação" desktop-dist/index.html
          echo "Aplicação web/PWA validada."
      - name: Empacotar versão web
        uses: actions/upload-artifact@v4
        with:
          name: Financa-Simples-Web
          path: desktop-dist
          retention-days: 30

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: desktop-dist
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
