name: Gerar instalador Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src-tauri/**"
      - "desktop-dist/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src-tauri/**"
      - "desktop-dist/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Instalar dependências
        run: npm ci

      - name: Validar aplicação embarcada
        shell: pwsh
        run: |
          $required = @(
            "desktop-dist/index.html",
            "desktop-dist/app.js",
            "desktop-dist/styles.css"
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Arquivo obrigatório do modo offline não encontrado: $path"
            }
          }

          $index = Get-Content "desktop-dist/index.html" -Raw
          if ($index -match "window.location.replace") {
            throw "O desktop voltou a depender de redirecionamento remoto."
          }

          Write-Host "Frontend local presente e sem redirecionamento obrigatório."

      - name: Verificar núcleo Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Compilar instalador NSIS
        run: npm run build -- --config src-tauri/tauri.unsigned.conf.json --bundles nsis

      - name: Smoke test do executável
        shell: pwsh
        run: |
          $exe = Resolve-Path "src-tauri/target/release/financa-simples-desktop.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          $process.Refresh()

          if ($process.HasExited) {
            throw "O Finança Simples encerrou durante a inicialização. ExitCode=$($process.ExitCode)"
          }

          Stop-Process -Id $process.Id -Force
          Write-Host "Smoke test aprovado: núcleo offline permaneceu aberto por 12 segundos."

      - name: Publicar instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Financa-Simples-Windows-Installer
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/financa-simples-desktop.exe

      - name: Publicar pré-release para download direto
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Instalador NSIS não encontrado."
          }

          git tag -f desktop-preview $env:GITHUB_SHA
          git push origin desktop-preview --force

          gh release view desktop-preview 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create desktop-preview $installer.FullName `
              --prerelease `
              --title "Finança Simples para Windows" `
              --notes "Build offline-first validado: frontend embarcado, SQLite local e smoke test automático."
          } else {
            $oldAssets = gh release view desktop-preview --json assets --jq '.assets[].name'
            foreach ($asset in $oldAssets) {
              if ($asset -like "*.exe") {
                gh release delete-asset desktop-preview $asset -y
              }
            }
            gh release upload desktop-preview $installer.FullName
            gh release edit desktop-preview `
              --title "Finança Simples para Windows" `
              --notes "Build offline-first validado: frontend embarcado, SQLite local e smoke test automático."
          }
