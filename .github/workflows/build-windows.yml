name: Gerar instalador Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src-tauri/**"
      - "desktop-dist/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src-tauri/**"
      - "desktop-dist/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Instalar dependências
        run: npm ci

      - name: Validar frontend financeiro embarcado
        shell: pwsh
        run: |
          $required = @(
            "desktop-dist/index.html",
            "desktop-dist/core-v14.js",
            "desktop-dist/app-v14.js",
            "desktop-dist/app-v15.js",
            "desktop-dist/styles.css"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Arquivo obrigatório não encontrado: $path"
            }
          }

          node --check desktop-dist/core-v14.js
          node --check desktop-dist/app-v14.js
          node --check desktop-dist/app-v15.js

          $index = Get-Content "desktop-dist/index.html" -Raw
          $core = Get-Content "desktop-dist/core-v14.js" -Raw
          $app = Get-Content "desktop-dist/app-v14.js" -Raw
          $pro = Get-Content "desktop-dist/app-v15.js" -Raw
          $styles = Get-Content "desktop-dist/styles.css" -Raw
          $frontend = "$index`n$core`n$app`n$pro`n$styles"

          if ($frontend -match "window.location.replace") {
            throw "O aplicativo voltou a depender de redirecionamento remoto."
          }

          $forbidden = @(
            "Produtos & Precificação",
            "Produtos e precificação",
            "Gestão de funcionários",
            "Funcionários",
            "Estoque",
            "payrollTotal",
            "inventoryValue",
            "productRecommendedPrice"
          )
          foreach ($term in $forbidden) {
            if ($frontend -match [regex]::Escape($term)) {
              throw "Escopo incorreto detectado no Finança Simples: $term"
            }
          }

          $requiredLabels = @(
            "Dashboard",
            "Lançamentos",
            "Contas & Cartões",
            "Dashboard Analítico",
            "Open Finance",
            "Investimentos",
            "Parametrização"
          )
          foreach ($label in $requiredLabels) {
            if ($frontend -notmatch [regex]::Escape($label)) {
              throw "Módulo obrigatório ausente: $label"
            }
          }

          $requiredFeatures = @(
            "Nova saída",
            "Nova entrada",
            "Compra no cartão",
            "installmentCount",
            "saveRegularLaunch",
            "saveCardLaunch",
            "areaCategoryId",
            "closingDay",
            "dueDay",
            "Faturas do próximo mês",
            "Renda média mensal",
            "openingBalanceCents",
            "Banco 1",
            "Banco 2",
            "Dinheiro",
            "upsert_entities",
            "startupSplash",
            "analysisStart",
            "analysisEnd",
            "Volumetria financeira",
            "Composição do próximo mês",
            "cleanProductCopy",
            "removeReferenceColumn"
          )
          foreach ($feature in $requiredFeatures) {
            if ($frontend -notmatch [regex]::Escape($feature)) {
              throw "Funcionalidade financeira obrigatória ausente: $feature"
            }
          }

          if ($app -match "Cadastre uma conta antes de lançar movimentos") {
            throw "Conta bancária voltou a ser pré-requisito para lançamentos."
          }

          if ($index -notmatch "app-v15.js") {
            throw "Camada profissional 1.5 não está carregada no aplicativo."
          }

          Write-Host "Frontend validado: operação financeira, dashboard analítico por período, gráficos, composição do próximo mês e splash de abertura."

      - name: Testar banco local e relações financeiras
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Verificar núcleo Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Compilar instalador NSIS
        run: npm run build -- --config src-tauri/tauri.unsigned.conf.json --bundles nsis

      - name: Smoke test do executável
        shell: pwsh
        run: |
          $exe = Resolve-Path "src-tauri/target/release/financa-simples-desktop.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          $process.Refresh()

          if ($process.HasExited) {
            throw "O Finança Simples encerrou durante a inicialização. ExitCode=$($process.ExitCode)"
          }

          Stop-Process -Id $process.Id -Force
          Write-Host "Smoke test aprovado: aplicativo permaneceu aberto por 15 segundos."

      - name: Publicar instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Financa-Simples-Windows-Installer
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/financa-simples-desktop.exe

      - name: Publicar pré-release para download direto
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Instalador NSIS não encontrado."
          }

          git tag -f desktop-preview $env:GITHUB_SHA
          git push origin desktop-preview --force

          $notes = "Build Windows 1.5: dashboard analítico com filtro por período, gráficos de entradas, saídas e faturas, composição do próximo mês, indicadores de organização financeira, tela de abertura com marca por 5 segundos, lançamentos, contas, cartões, parcelas, investimentos, SQLite local, backup e importação CSV."

          gh release view desktop-preview 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create desktop-preview $installer.FullName `
              --prerelease `
              --title "Finança Simples para Windows" `
              --notes $notes
          } else {
            $oldAssets = gh release view desktop-preview --json assets --jq '.assets[].name'
            foreach ($asset in $oldAssets) {
              if ($asset -like "*.exe") {
                gh release delete-asset desktop-preview $asset -y
              }
            }
            gh release upload desktop-preview $installer.FullName
            gh release edit desktop-preview `
              --title "Finança Simples para Windows" `
              --notes $notes
          }
