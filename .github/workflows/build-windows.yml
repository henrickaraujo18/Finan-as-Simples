name: Gerar instalador Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src-tauri/**"
      - "desktop-dist/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Instalar dependências
        run: npm ci

      - name: Compilar instalador NSIS
        run: npm run build -- --config src-tauri/tauri.unsigned.conf.json --bundles nsis

      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Financa-Simples-Windows-Installer
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/financa-simples-desktop.exe
