name: Verificação final cloud 1.6

on:
  push:
    branches:
      - feature/auth-workspaces-auto-update-1.6
    paths:
      - ".github/workflows/final-cloud-check-v16.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auth-workspaces-auto-update-1.6
          fetch-depth: 0

      - name: Corrigir mensagem de conta cloud existente
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('desktop-dist/cloud-runtime-v16.js')
          t=p.read_text(encoding='utf-8')
          old='''      const created = await signUp(email, password);
                  if (!created?.access_token) {
                    throw new Error("Conta criada. Confirme seu e-mail e depois volte ao Finança Simples com o mesmo e-mail e senha.");
                  }
          '''
          new='''      const created = await signUp(email, password);
                  if (created?.user?.identities && created.user.identities.length === 0) {
                    clearCloudSession();
                    throw new Error("Esta conta já existe na nuvem com outra senha. Use ‘Esqueci minha senha’ para recuperar o acesso.");
                  }
                  if (!created?.access_token) {
                    clearCloudSession();
                    throw new Error("Conta criada. Confirme seu e-mail e depois volte ao Finança Simples com o mesmo e-mail e senha.");
                  }
          '''
          if old not in t:
              raise SystemExit('trecho de criação cloud não encontrado')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
          node --check desktop-dist/cloud-runtime-v16.js

      - name: Validar perímetro público Supabase
        shell: bash
        env:
          BASE: https://jozjcqskvkwxoaqmthrj.supabase.co
          KEY: sb_publishable_pIcoV3Oq9FZSzVvTXQy8GQ_5Zf9SXq8
        run: |
          set -euo pipefail
          reset_status=$(curl -sS -o /tmp/reset.html -w '%{http_code}' "$BASE/functions/v1/reset-password")
          test "$reset_status" = "200"
          grep -q "Finança Simples" /tmp/reset.html

          recover_status=$(curl -sS -o /tmp/recover.json -w '%{http_code}' \
            -X POST "$BASE/auth/v1/recover?redirect_to=$BASE/functions/v1/reset-password" \
            -H "apikey: $KEY" -H 'Content-Type: application/json' \
            --data '{"email":"financa-simples-redirect-check-20260911@example.invalid"}')
          test "$recover_status" = "200"

          anon_rpc=$(curl -sS -o /tmp/rpc.json -w '%{http_code}' \
            -X POST "$BASE/rest/v1/rpc/fs_my_workspaces" \
            -H "apikey: $KEY" -H 'Content-Type: application/json' --data '{}')
          test "$anon_rpc" = "401" -o "$anon_rpc" = "403"

          diagnostic=$(curl -sS -o /tmp/diag.json -w '%{http_code}' "$BASE/functions/v1/auth-diagnostic")
          test "$diagnostic" = "401" -o "$diagnostic" = "403"

          echo "Reset page=$reset_status; recovery redirect=$recover_status; anonymous RPC=$anon_rpc; diagnostic=$diagnostic"

      - name: Commitar correção
        shell: bash
        run: |
          git config user.name "Finança Simples CI"
          git config user.email "actions@users.noreply.github.com"
          git add desktop-dist/cloud-runtime-v16.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: handle existing cloud account during first setup"
          git push origin HEAD:feature/auth-workspaces-auto-update-1.6
