name: Integrar sync imediato 1.6

on:
  push:
    branches:
      - feature/auth-workspaces-auto-update-1.6
    paths:
      - ".github/workflows/final-sync-hook-v16.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auth-workspaces-auto-update-1.6
      - name: Aplicar hook e validar JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('desktop-dist/cloud-runtime-v16.js')
          t=p.read_text(encoding='utf-8')
          old='''  tauriCore.invoke = async function securedCloudInvoke(command, args = {}) {
              if (!cloudCommands.has(command)) return nativeInvoke(command, args);
          '''
          new='''  tauriCore.invoke = async function securedCloudInvoke(command, args = {}) {
              if (!cloudCommands.has(command)) {
                const result = await nativeInvoke(command, args);
                if (["upsert_entity", "upsert_entities", "delete_entity"].includes(command)) scheduleSync(80);
                return result;
              }
          '''
          if old not in t: raise SystemExit('hook de invoke não encontrado')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
          node --check desktop-dist/cloud-runtime-v16.js
      - name: Commitar
        shell: bash
        run: |
          git config user.name "Finança Simples CI"
          git config user.email "actions@users.noreply.github.com"
          git add desktop-dist/cloud-runtime-v16.js
          git commit -m "fix: sync immediately after financial mutations"
          git push origin HEAD:feature/auth-workspaces-auto-update-1.6
