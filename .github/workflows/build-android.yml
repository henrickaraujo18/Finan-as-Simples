name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src-tauri/**"
      - "desktop-dist/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK pré-instalado
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "NDK_HOME=/usr/local/lib/android/sdk/ndk/27.2.12479018" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Preparar Rust para Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Instalar dependências do projeto
        run: npm ci

      - name: Verificar arquivos obrigatórios
        run: |
          test -f desktop-dist/index.html
          test -f desktop-dist/cloud-config.js
          test -f src-tauri/src/lib_operational.rs
          test -f src-tauri/src/cloud_runtime_v16.rs
          node --check desktop-dist/cloud-runtime-v16.js || node --check desktop-dist/cloud-runtime-v16.js

      - name: Inicializar projeto Android Tauri
        run: npm run tauri android init -- --ci

      - name: Compilar APK de release
        run: npm run tauri android build -- --apk --target aarch64

      - name: Publicar APK para instalação e teste
        uses: actions/upload-artifact@v4
        with:
          name: Financa-Simples-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
