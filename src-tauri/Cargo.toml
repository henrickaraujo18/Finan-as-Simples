[package]
name = "financa-simples-desktop"
version = "1.0.0"
description = "Aplicativo Windows do Finança Simples"
authors = ["Finança Simples"]
edition = "2021"

[lib]
name = "financa_simples_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time"] }
url = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
