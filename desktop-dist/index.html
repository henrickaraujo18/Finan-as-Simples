<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Finança Simples</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #07120f; color: #e8fff7; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, #102a22 0, #07120f 48%, #040a08 100%); }
      main { width: min(440px, calc(100vw - 40px)); text-align: center; padding: 2.2rem; border: 1px solid #35d0a533; border-radius: 28px; background: #081712e8; box-shadow: 0 24px 80px #0009; }
      .mark { width: 78px; height: 78px; margin: 0 auto 1.25rem; border-radius: 24px; display: grid; place-items: center; background: #0d211b; border: 1px solid #35d0a566; color: #35d0a5; font-size: 1.8rem; font-weight: 800; }
      h1 { margin: 0; font-size: 1.55rem; }
      p { margin: .7rem 0 0; color: #9ab7ad; line-height: 1.5; }
      .spinner { width: 28px; height: 28px; margin: 1.4rem auto 0; border: 3px solid #24463b; border-top-color: #35d0a5; border-radius: 50%; animation: spin .8s linear infinite; }
      button { margin-top: 1.2rem; border: 0; border-radius: 12px; padding: .8rem 1.15rem; background: #35d0a5; color: #052019; font-weight: 700; cursor: pointer; }
      small { display: block; margin-top: 1.1rem; color: #668279; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">FS</div>
      <h1>Finança Simples</h1>
      <p id="status">Conectando ao seu ambiente financeiro...</p>
      <div class="spinner" aria-hidden="true"></div>
      <button id="open" type="button">Abrir sistema</button>
      <small>Versão desktop 1.0.1</small>
    </main>
    <script>
      const APP_URL = "https://financa-simples-gestao.henrickaraujo2009.chatgpt.site";
      const status = document.getElementById("status");
      const button = document.getElementById("open");

      function openSystem() {
        status.textContent = "Abrindo o Finança Simples...";
        window.location.replace(APP_URL);
      }

      button.addEventListener("click", openSystem);
      window.setTimeout(openSystem, 900);
    </script>
  </body>
</html>
