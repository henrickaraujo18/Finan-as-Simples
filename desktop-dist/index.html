<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Finança Simples</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #07120f; color: #e8fff7; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { text-align: center; padding: 2rem; }
      .mark { width: 72px; height: 72px; margin: 0 auto 1.25rem; border-radius: 22px; display: grid; place-items: center; background: #0d211b; border: 1px solid #35d0a566; box-shadow: 0 20px 60px #0008; color: #35d0a5; font-size: 1.75rem; font-weight: 800; }
      h1 { margin: 0; font-size: 1.5rem; }
      p { margin: .65rem 0 0; color: #9ab7ad; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">FS</div>
      <h1>Finança Simples</h1>
      <p>Preparando seu ambiente financeiro...</p>
    </main>
  </body>
</html>
