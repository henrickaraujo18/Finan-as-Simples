<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1512" />
    <meta name="color-scheme" content="dark" />
    <title>Finança Simples</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="security-v16.css" />
  </head>
  <body class="splash-active">
    <div id="startupSplash" class="startup-splash" role="status" aria-label="Finança Simples iniciando">
      <div class="splash-content">
        <div class="splash-logo" aria-hidden="true">FS</div>
        <div class="splash-brand">
          <strong>Finança Simples</strong>
          <span>Organização financeira com clareza e controle.</span>
        </div>
        <div class="splash-progress" aria-hidden="true"><i></i></div>
      </div>
    </div>

    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">FS</div>
          <div>
            <strong>Finança Simples</strong>
            <small>Controle financeiro</small>
          </div>
        </div>

        <nav class="nav" aria-label="Navegação principal">
          <button data-page="dashboard" class="active"><span>Dashboard</span></button>
          <button data-page="transactions"><span>Lançamentos</span></button>
          <button data-page="accounts"><span>Contas & Cartões</span></button>
          <button data-page="annual"><span>Dashboard Analítico</span></button>
          <button data-page="openfinance"><span>Open Finance</span></button>
          <button data-page="investments"><span>Investimentos</span></button>
          <button data-page="settings"><span>Parametrização</span></button>
          <button data-page="access"><span>Usuários & Acessos</span></button>
        </nav>

        <div class="sidebar-foot">
          <span id="platformBadge" class="side-badge">—</span>
          <small id="storageLabel">Inicializando armazenamento...</small>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div>
            <small>Finança Simples</small>
            <h1 id="pageTitle">Dashboard</h1>
          </div>
          <div class="topbar-actions">
            <span id="connectionBadge" class="status-badge">Verificando...</span>
          </div>
        </header>

        <div id="view" class="content">
          <section class="loading">Carregando o sistema...</section>
        </div>
      </main>
    </div>

    <script src="core-v14.js"></script>
    <script src="cloud-config.js"></script>
    <script src="cloud-runtime-v16.js"></script>
    <script src="auth-v16.js"></script>
    <script src="cloud-ui-v16.js"></script>
    <script src="recovery-v16.js"></script>
    <script src="auth-recovery-v16.js"></script>
    <script src="app-v14.js"></script>
    <script src="app-v15.js"></script>
  </body>
</html>
